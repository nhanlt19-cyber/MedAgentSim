# config.yaml

api_keys:
  openai: ""        # để trống nếu không dùng OpenAI trực tiếp
  replicate: ""
  anthropic: ""      # Optional

inference:
  type: "llm"  # Options: llm, human_doctor, human_patient

biases:
  doctor: "None"  # Options: None, recency, frequency, false_consensus, confirmation, status_quo, gender, race, sexual_orientation, cultural, education, religion, socioeconomic
  patient: "None"  # Options: None, recency, frequency, false_consensus, self_diagnosis, gender, race, sexual_orientation, cultural, education, religion, socioeconomic

language_models:
  # Dùng alias "ollama" → BAgent sẽ map sang model Ollama "llama3.1:8b"
  doctor: "ollama"
  patient: "ollama"
  measurement: "ollama"
  moderator: "ollama"

# ---------------------------------------------------------------------------
# Remote LLM server configuration (optional)
# If you prefer to send prompts to a hosted LLM rather than local Ollama/vLLM,
# specify the URL and bearer token below. These values will be exported as
# SERVER_URL and SERVER_TOKEN early in medsim/simulate/__main__.py.
# Example:
# remote_llm:
#   url: "https://llmapi.iec-uit.com/v1/chat/completions"
#   token: "sk-llmiec-e90a0e08c8640e7c5995037551a19af5"
# ---------------------------------------------------------------------------
remote_llm: {}

scenario:
  dataset: "MedQA"  # Options: MedQA, MedQA_Ext, NEJM, NEJM_Ext, MIMICIV
  image_request: false
  num_scenarios: 1    # chạy 1 scenario để test nhanh với frontend
  total_inferences: 10